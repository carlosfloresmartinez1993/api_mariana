# Integración continua: se ejecuta en cada push y en cada pull request.
# Render está configurado (render.yaml → autoDeployTrigger: checksPass) para desplegar
# solo si todos estos trabajos terminan bien.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (migraciones y pruebas)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: empresas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d empresas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/empresas_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/empresas_test
      SECRET_KEY: clave-solo-para-ci-0123456789abcdef0123456789abcdef
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias (versiones exactas)
        run: pip install -r requirements-dev.txt

      - name: Migraciones desde cero y coincidencia con los modelos
        run: |
          alembic upgrade head
          alembic check

      - name: Pruebas
        run: pytest -q

  frontend:
    name: Frontend (tipos y build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias (package-lock.json)
        run: npm ci

      - name: Revisar tipos y compilar
        run: npm run build

  docker:
    name: Imagen Docker (la que usa Render)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - name: Construir la imagen
        run: docker build -t control-empresas:ci .
